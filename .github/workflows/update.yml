name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: '17 */6 * * *'   # 6시간마다 (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['public/data/**', 'data/cache.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 금리·경제지표·뉴스·지가 수집
        run: node collect.js
      - name: 수집 결과 커밋 (금리 이력 누적)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/cache.json
          git diff --cached --quiet || git commit -m "데이터 자동 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
